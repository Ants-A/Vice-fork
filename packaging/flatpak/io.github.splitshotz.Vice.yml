# Native Rust daemon + Wry desktop, built offline from the checked-out source.
# tools/ci/flatpak.sh stages the Cargo.lock-pinned vendor sources first.
id: io.github.splitshotz.Vice
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: vice-app
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/vice/cargo-home
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:ro
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'
modules:
  # wmctrl and xclip need it, and the runtime does not ship it.
  - name: libXmu
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://www.x.org/releases/individual/lib/libXmu-1.2.1.tar.xz
        sha256: fcb27793248a39e5fcc5b9c4aec40cc0734b3ca76aac3d7d1c264e7f7e14e8b2

  - name: xprop
    sources:
      - type: archive
        url: https://www.x.org/releases/individual/app/xprop-1.2.8.tar.xz
        sha256: d689e2adb7ef7b439f6469b51cda8a7daefc83243854c2a3b8f84d0f029d67ee

  - name: xdotool
    buildsystem: simple
    build-commands:
      - make PREFIX=${FLATPAK_DEST} WITHOUT_RPATH_FIX=1
      - make PREFIX=${FLATPAK_DEST} WITHOUT_RPATH_FIX=1 install
    sources:
      - type: archive
        url: https://github.com/jordansissel/xdotool/releases/download/v3.20211022.1/xdotool-3.20211022.1.tar.gz
        sha256: 96f0facfde6d78eacad35b91b0f46fecd0b35e474c03e00e30da3fdd345f9ada

  - name: wmctrl
    sources:
      - type: archive
        url: https://deb.debian.org/debian/pool/main/w/wmctrl/wmctrl_1.07.orig.tar.gz
        sha256: d78a1efdb62f18674298ad039c5cbdb1edb6e8e149bb3a8e3a01a4750aa3cca9

  - name: xclip
    sources:
      - type: archive
        url: https://github.com/astrand/xclip/archive/refs/tags/0.13.tar.gz
        sha256: ca5b8804e3c910a66423a882d79bf3c9450b875ac8528791fb60ec9de667f758

  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dzshcompletiondir=no
      - -Dfishcompletiondir=no
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.3.0.tar.gz
        sha256: b4dc560973f0cd74e02f817ffa2fd44ba645a4f1ea94b7b9614dacc9f895f402

  # FFmpeg is an application tool, not just the runtime's playback libraries.
  - name: x264
    buildsystem: autotools
    no-autogen: true
    config-opts:
      - --disable-cli
      - --enable-shared
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55

  - name: ffmpeg
    buildsystem: autotools
    no-autogen: true
    config-opts:
      - --disable-debug
      - --disable-doc
      - --disable-static
      - --enable-shared
      - --enable-gpl
      - --enable-libx264
      - --enable-libvpx
      - --enable-libopus
      - --enable-libfreetype
      - --enable-libharfbuzz
      - --enable-libfontconfig
      - --enable-libpulse
    sources:
      - type: git
        url: https://git.ffmpeg.org/ffmpeg.git
        tag: n8.0.1

  - name: cloudflared
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - install -Dm755 cloudflared-linux-amd64 ${FLATPAK_DEST}/bin/cloudflared
    sources:
      - type: file
        url: https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64
        sha256: 1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872

  # Native tray dependencies, pinned to the releases used by Flathub's
  # shared-modules/libayatana-appindicator recipe.
  - name: intltool
    cleanup: ['*']
    sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd
      - type: shell
        commands:
          - sed -i 's/\${/\$\\{/g' intltool-update.in

  - name: libdbusmenu
    buildsystem: autotools
    build-options:
      env:
        HAVE_VALGRIND_TRUE: ''
        HAVE_VALGRIND_FALSE: '#'
        MAKEFLAGS: '-j1'
    make-args:
      - CFLAGS=-Wall -O2 -g -fPIC -Wno-error
      - CXXFLAGS=-Wall -O2 -g -fPIC -Wno-error
    config-opts:
      - --with-gtk=3
      - --disable-dumper
      - --disable-static
      - --disable-tests
      - --disable-gtk-doc
      - --enable-introspection=no
      - --disable-vala
    sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a

  - name: ayatana-ido
    buildsystem: cmake-ninja
    config-opts: ['-DENABLE_TESTS=OFF', '-DCMAKE_INSTALL_LIBDIR=lib']
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/ayatana-ido.git
        tag: '0.10.4'
        commit: f968079b09e2310fefc3fc307359025f1c74b3eb

  - name: libayatana-indicator
    buildsystem: cmake-ninja
    config-opts: ['-DENABLE_TESTS=OFF', '-DCMAKE_INSTALL_LIBDIR=lib']
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-indicator.git
        tag: '0.9.4'
        commit: 611bb384b73fa6311777ba4c41381a06f5b99dad

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_BINDINGS_MONO=OFF
      - -DENABLE_BINDINGS_VALA=OFF
      - -DENABLE_GTKDOC=OFF
      - -DENABLE_TESTS=OFF
      - -DFLAVOUR_GTK3=ON
      - -DCMAKE_INSTALL_LIBDIR=lib
    sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-appindicator.git
        tag: '0.5.94'
        commit: 31e8bb083b307e1cc96af4874a94707727bd1e79

  - name: gtk-layer-shell
    buildsystem: meson
    config-opts:
      - -Dvapi=false
      - -Dtests=false
      - -Dexamples=false
      - -Ddocs=false
    sources:
      - type: archive
        url: https://github.com/wmww/gtk-layer-shell/archive/refs/tags/v0.10.1.tar.gz
        sha256: 88c3a3e0a5300532f3d368d5df64838a87f1fb85273f22d41df0a6b8d0ec59c6

  - name: vice
    buildsystem: simple
    build-commands:
      - cargo build --release --locked --offline
      - install -Dm755 target/release/vice ${FLATPAK_DEST}/bin/vice
      - install -Dm755 target/release/vice-app ${FLATPAK_DEST}/bin/vice-app
      - mkdir -p ${FLATPAK_DEST}/share/vice
      - cp -r vice/ui vice/fonts vice/data ${FLATPAK_DEST}/share/vice/
      - install -Dm644 vice.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 assets/vice.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 assets/vice.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/vice.svg
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - node_modules
          - target
          - build
          - .flatpak-cargo
          - .flatpak-builder
          - flatpak-build
          - site
      - type: dir
        path: ../../.flatpak-cargo
        dest: .cargo
