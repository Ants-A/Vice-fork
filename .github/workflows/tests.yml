name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install desktop and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev ffmpeg
      - name: Check formatting
        run: cargo fmt --check
      - name: Check all targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test native build and FFmpeg integrations
        run: cargo test --locked --all-targets
      - name: Test headless build
        run: cargo test --locked --all-targets --no-default-features
      - name: Build native binaries
        run: cargo build --release --locked
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:player
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm run build
